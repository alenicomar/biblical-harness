name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # CI=true (set by GitHub Actions) makes scripts/postinstall.mjs skip the user install.
      - run: npm ci
      # Typecheck + tests, including the committed dist/ and skills/ drift tests.
      - run: npm run check
