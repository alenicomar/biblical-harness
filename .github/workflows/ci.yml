name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a PR supersedes its older run. Pushes to main group by commit, so no
# run on main is cancelled or replaced while pending: each merged commit is checked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # CI=true (set by GitHub Actions) makes scripts/postinstall.mjs skip the user install.
      - run: npm ci
      # Typecheck + tests, including the committed dist/ and skills/ drift tests.
      - run: npm run check
